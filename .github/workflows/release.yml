# Publish to npm when a GitHub release is published.
# It uses npm trusted publishing (OIDC), so the repository holds no npm token.
# npm creates the provenance statement for the package.
# Before the first run: publish 0.2.0 once by hand and add this workflow as the
# trusted publisher of @taskade/cli on npmjs.com. See "For maintainers" in README.md.

name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Trusted publishing needs npm 11.5.1 or later. Node 24 includes it.
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Check that the tag equals the package version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::The release tag is $TAG, but package.json has version $VERSION. The tag must be v$VERSION."
            exit 1
          fi
      - run: npm test
      - run: npm publish --provenance --access public
